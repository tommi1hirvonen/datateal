# Secrets — sensitive values stored encrypted, injected as Kubernetes Secret references.
# Available as os.environ['KEY'] in Python code, identical to environment variables from
# the kernel's perspective.
#
# SECRET VALUES ARE NEVER EXPORTED. On export, only the key and description are written.
#
# On deploy:
#   - If the secret already exists and `value` is omitted → NoChange (value preserved).
#   - If the secret is new and `value` is omitted → plan error (value required for new secrets).
#   - Use ${env.NAME} to inject the value from a CI/CD pipeline secret at deploy time.

- key: db_password
  value: ${env.DB_PASSWORD}
  description: >
    PostgreSQL password for the DuckLake catalog metadata database.
    Set via GitHub Actions secret DB_PASSWORD.

- key: api_key_partner
  value: ${env.PARTNER_API_KEY}
  description: >
    API key for the partner data ingestion service.
    Set via GitHub Actions secret PARTNER_API_KEY.
