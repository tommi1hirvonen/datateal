# Admin-scope bundle manifest.
# Deploy via: POST api/deployments/admin/{plan|apply}
# Semantics:  UPSERT-ONLY — creates and updates resources, never deletes.
# Auth:       Admin API token.

scope: admin

# Optional deploy-time variables referenced as ${var.NAME} in any resource file.
# Values are static strings defined here — not secrets (use ${env.NAME} for those).
variables:
  # Azure Data Lake Storage account name for external catalog connections.
  adls_account: mystorageaccount
