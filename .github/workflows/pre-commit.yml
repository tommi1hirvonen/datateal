name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      # Run a single dotnet command up front so the one-time, per-machine NuGet
      # "migrations" complete serially. `dotnet format` loads the solution with
      # MSBuildWorkspace, which spawns several concurrent dotnet/MSBuild child
      # processes. On the first run each child races to create the global
      # "NuGet-Migrations" named mutex (backed by a /tmp/.dotnet/shm/* file on
      # Linux) and one intermittently fails with:
      #   System.IO.IOException: ... 'NuGet-Migrations' ... errno == EEXIST
      # Once the migrations have run once the sentinels exist and the mutex is
      # never created again, so warming up here eliminates the race. (Note:
      # DOTNET_SKIP_FIRST_TIME_EXPERIENCE no longer suppresses this on .NET 7+.)
      - name: Warm up NuGet migrations
        run: dotnet nuget locals global-packages --list

      - name: Install pre-commit
        run: python -m pip install pre-commit

      # Cache pre-commit hook environments (previously handled by
      # pre-commit/action) so switching to a manual run doesn't regress speed.
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      # Retry once as defense-in-depth: besides the NuGet-Migrations race above,
      # MSBuild workspace loads can hit other transient hiccups that clear on a
      # second run. A real formatting/lint failure still fails both attempts.
      - name: Run pre-commit
        run: |
          pre-commit run --show-diff-on-failure --color=always --all-files \
            || pre-commit run --show-diff-on-failure --color=always --all-files
