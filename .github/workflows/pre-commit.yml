name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    env:
      # Prevents a race condition where concurrent dotnet processes all try to
      # create the NuGet-Migrations named mutex simultaneously on first run.
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - uses: pre-commit/action@v3.0.0
